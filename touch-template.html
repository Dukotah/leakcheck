<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeakCheck — apple touch icon</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{margin:0}
  .icon{
    width:180px;height:180px;background:#bf6b3c;
    display:flex;align-items:center;justify-content:center;
    /* apple rounds corners itself, but a subtle inset depth helps the screenshot */
    position:relative;overflow:hidden;
  }
  .icon::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 120% at 30% 18%, rgba(255,255,255,.16), rgba(0,0,0,.12));}
  .mark{width:118px;height:118px;position:relative;z-index:1}
</style>
</head>
<body>
  <div class="icon">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <!-- on copper bg: shield in ink, keyhole in paper, magnifier in white -->
      <path d="M32 4 54 12 V30 C54 44 45 54 32 60 C19 54 10 44 10 30 V12 Z" fill="#14181f"/>
      <path d="M32 10 48 16 V30 C48 41 41.5 49 32 54 C22.5 49 16 41 16 30 V16 Z" fill="#1d222b"/>
      <circle cx="32" cy="28" r="6" fill="#faf8f4"/>
      <path d="M29.6 31.5 H34.4 L36 44 H28 Z" fill="#faf8f4"/>
      <circle cx="42" cy="40" r="9" fill="none" stroke="#ffffff" stroke-width="4"/>
      <line x1="48.4" y1="46.4" x2="56" y2="54" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    </svg>
  </div>
</body>
</html>
