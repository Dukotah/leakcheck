<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="LeakCheck">
  <!-- Shield with keyhole + magnifier accent. Copper #bf6b3c + ink #14181f, transparent bg. -->
  <!-- Shield body -->
  <path d="M32 4 54 12 V30 C54 44 45 54 32 60 C19 54 10 44 10 30 V12 Z"
        fill="#bf6b3c"/>
  <!-- Inner ink panel -->
  <path d="M32 10 48 16 V30 C48 41 41.5 49 32 54 C22.5 49 16 41 16 30 V16 Z"
        fill="#14181f"/>
  <!-- Keyhole: circle + stem -->
  <circle cx="32" cy="28" r="6" fill="#faf8f4"/>
  <path d="M29.6 31.5 H34.4 L36 44 H28 Z" fill="#faf8f4"/>
  <!-- Magnifier ring sweeping across, copper outline -->
  <circle cx="42" cy="40" r="9" fill="none" stroke="#bf6b3c" stroke-width="4"/>
  <line x1="48.4" y1="46.4" x2="56" y2="54" stroke="#bf6b3c" stroke-width="5" stroke-linecap="round"/>
</svg>
